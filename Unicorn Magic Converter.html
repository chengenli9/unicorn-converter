<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unicorn Magic Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6fcf; --lav:#b983ff; --sky:#6fd8ff; --mint:#7cffb2; --sun:#ffe96f;
    --plum:#241333; --panel:#fff8fc; --ink:#241333;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    height:100%; margin:0; background:var(--plum);
    font-family:'VT323', monospace, sans-serif;
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow-x:hidden; position:relative;
    background-image:
      linear-gradient(120deg, var(--pink), var(--lav), var(--sky), var(--mint), var(--sun), var(--pink));
    background-size:300% 300%;
    animation:rainbow 14s ease infinite;
  }
  @keyframes rainbow{
    0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
  }
  #candyRain{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  .drop{position:absolute; top:-10vh; filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3)); animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite;}
  .drop img{display:block; width:100%; height:auto; image-rendering:pixelated;}
  @keyframes fall{
    0%{transform:translateY(-10vh) rotate(0deg);}
    100%{transform:translateY(115vh) rotate(360deg);}
  }
  .titlebar{display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:18px;}
  .titlebar img{width:52px; height:52px; image-rendering:pixelated;}

  .card{
    position:relative; z-index:2; width:min(90vw,460px); background:var(--panel);
    padding:32px 28px 28px; text-align:center;
    clip-path:polygon(0 12px,12px 12px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px));
    box-shadow: 0 0 0 6px var(--ink), 10px 10px 0 6px rgba(0,0,0,.35);
  }
  h1{
    font-family:'Press Start 2P', monospace; font-size:1rem; line-height:1.7;
    margin:0 0 18px; color:var(--ink);
  }
  h1 span{display:block; font-size:1.6rem;}
  .step{margin:18px 0; text-align:left;}
  label{font-size:1.2rem; display:block; margin-bottom:6px;}
  .filebtn{
    display:inline-block; width:100%; text-align:center; padding:12px;
    font-family:'Press Start 2P'; font-size:.7rem; cursor:pointer;
    background:var(--sky); color:var(--ink);
    box-shadow:0 0 0 4px var(--ink), 5px 5px 0 4px rgba(0,0,0,.3);
  }
  .filebtn:active{transform:translate(3px,3px); box-shadow:0 0 0 4px var(--ink), 2px 2px 0 4px rgba(0,0,0,.3);}
  input[type=file]{display:none;}
  #fileName{font-size:1.1rem; margin-top:8px; word-break:break-all; min-height:1.4em;}
  select{
    width:100%; padding:10px; font-family:'VT323'; font-size:1.3rem;
    background:var(--sun); color:var(--ink); border:none;
    box-shadow:0 0 0 4px var(--ink);
  }
  button#convertBtn{
    margin-top:22px; width:100%; padding:14px; border:none; cursor:pointer;
    font-family:'Press Start 2P'; font-size:.8rem;
    background:var(--mint); color:var(--ink);
    box-shadow:0 0 0 4px var(--ink), 6px 6px 0 4px rgba(0,0,0,.3);
  }
  button#convertBtn:active:not(:disabled){transform:translate(3px,3px); box-shadow:0 0 0 4px var(--ink), 3px 3px 0 4px rgba(0,0,0,.3);}
  button#convertBtn:disabled{background:#ddd; color:#999; cursor:not-allowed; box-shadow:0 0 0 4px var(--ink);}
  #status{margin-top:16px; font-size:1.2rem; min-height:1.6em;}
  footer{margin-top:14px; font-size:.95rem; opacity:.65;}
</style>
</head>

  ];
  const rainLayer = document.getElementById('candyRain');
  const DROP_COUNT = 16;
  for (let i = 0; i < DROP_COUNT; i++) {
    const drop = document.createElement('div');
    drop.className = 'drop';
    const img = document.createElement('img');
    img.src = CANDY_ICONS[i % CANDY_ICONS.length];
    drop.appendChild(img);
    const size = 26 + Math.random() * 26;
    const duration = 9 + Math.random() * 10;
    drop.style.left = (Math.random() * 96) + 'vw';
    drop.style.width = size + 'px';
    drop.style.animationDuration = duration + 's';
    drop.style.animationDelay = (-Math.random() * duration) + 's';
    rainLayer.appendChild(drop);
  }

  const fileInput = document.getElementById('fileInput');
  const fileNameLabel = document.getElementById('fileName');
  const formatSelect = document.getElementById('formatSelect');
  const convertBtn = document.getElementById('convertBtn');
  const statusEl = document.getElementById('status');

  let currentFile = null, currentKind = null;

  const FORMATS = {
    pdf:   [{v:'png', l:'🖼️ PNG image(s)'}, {v:'txt', l:'📝 TXT text'}],
    image: [{v:'pdf', l:'📄 PDF'}],
    text:  [{v:'pdf', l:'📄 PDF'}]
  };

  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    currentFile = f;
    fileNameLabel.textContent = f.name;
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (ext === 'pdf') currentKind = 'pdf';
    else if (['png','jpg','jpeg','gif','bmp','webp'].includes(ext)) currentKind = 'image';
    else if (['txt','md','csv'].includes(ext)) currentKind = 'text';
    else currentKind = null;

    formatSelect.innerHTML = '';
    statusEl.textContent = '';
    if (currentKind) {
      FORMATS[currentKind].forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.v; opt.textContent = o.l;
        formatSelect.appendChild(opt);
      });
      formatSelect.disabled = false;
      convertBtn.disabled = false;
    } else {
      formatSelect.innerHTML = '<option>✨ try a pdf, image or txt file ✨</option>';
      formatSelect.disabled = true;
      convertBtn.disabled = true;
      statusEl.textContent = "that flavor isn't supported yet 🍬";
    }
  });

  convertBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    const target = formatSelect.value;
    statusEl.textContent = '🌈 sprinkling magic...';
    convertBtn.disabled = true;
    try {
      if (currentKind === 'image' && target === 'pdf') await imageToPdf(currentFile);
      else if (currentKind === 'text' && target === 'pdf') await textToPdf(currentFile);
      else if (currentKind === 'pdf' && target === 'png') await pdfToPng(currentFile);
      else if (currentKind === 'pdf' && target === 'txt') await pdfToTxt(currentFile);
      statusEl.textContent = '🎉 tada! check your downloads 🎉';
    } catch (e) {
      console.error(e);
      statusEl.textContent = '💔 oops: ' + e.message;
    }
    convertBtn.disabled = false;
  });

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function baseName(name){ return name.replace(/\.[^.]+$/, ''); }

  async function imageToPdf(file) {
    const bytes = await file.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.create();
    let img;
    if (/png/i.test(file.type) || /\.png$/i.test(file.name)) img = await pdfDoc.embedPng(bytes);
    else img = await pdfDoc.embedJpg(bytes);
    const page = pdfDoc.addPage([img.width, img.height]);
    page.drawImage(img, {x:0, y:0, width:img.width, height:img.height});
    const pdfBytes = await pdfDoc.save();
    download(new Blob([pdfBytes], {type:'application/pdf'}), baseName(file.name) + '.pdf');
  }

  async function textToPdf(file) {
    const text = await file.text();
    const pdfDoc = await PDFLib.PDFDocument.create();
    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    const fontSize = 12, margin = 50, pageW = 612, pageH = 792;
    const maxWidth = pageW - margin * 2;
    const lines = [];
    text.split('\n').forEach(paragraph => {
      const words = paragraph.split(' ');
      let line = '';
      words.forEach(w => {
        const test = line ? line + ' ' + w : w;
        if (font.widthOfTextAtSize(test, fontSize) > maxWidth && line) {
          lines.push(line); line = w;
        } else line = test;
      });
      lines.push(line);
    });
    let page = pdfDoc.addPage([pageW, pageH]);
    let y = pageH - margin;
    const lineHeight = fontSize * 1.4;
    for (const line of lines) {
      if (y < margin) { page = pdfDoc.addPage([pageW, pageH]); y = pageH - margin; }
      page.drawText(line, {x: margin, y, size: fontSize, font});
      y -= lineHeight;
    }
    const pdfBytes = await pdfDoc.save();
    download(new Blob([pdfBytes], {type:'application/pdf'}), baseName(file.name) + '.pdf');
  }

  async function pdfToPng(file) {
    const bytes = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({scale: 2});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      download(blob, baseName(file.name) + (pdf.numPages > 1 ? `_page${i}` : '') + '.png');
    }
  }

  async function pdfToTxt(file) {
    const bytes = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      fullText += content.items.map(it => it.str).join(' ') + '\n\n';
    }
    download(new Blob([fullText], {type:'text/plain'}), baseName(file.name) + '.txt');
  }
